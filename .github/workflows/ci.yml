name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache-dependency-path: benchmarks/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -d . && exit 1)
      - name: vet
        run: go vet ./...
      - name: lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
      - name: README examples are in sync
        run: go run github.com/campoy/embedmd@v1.0.0 -d README.md
      - name: run examples
        run: |
          go run ./examples/quickstart
          go run ./examples/scopes
      - name: test
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: what only the hand-written tests reach
        run: |
          go test -count=1 -run 'TestMachine|TestConcurrent|TestProperty|FuzzMachine' -coverprofile=generators.out .
          go test -count=1 -coverprofile=everything.out .
          go run scripts/generatorgap.go -floor 80 generators.out everything.out
      - name: benchmarks compile and run
        working-directory: benchmarks
        run: |
          go vet ./...
          go test -run '^$' -bench . -benchtime=50ms ./...

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache-dependency-path: benchmarks/go.sum
      - name: fuzz the container against its invariants
        run: go test -run '^$' -fuzz 'FuzzMachine$' -fuzztime 90s .
      - name: fuzz the concurrent oracles
        run: go test -race -run '^$' -fuzz FuzzMachineConcurrent -fuzztime 90s .
      - name: upload any failing input
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-corpus
          path: testdata/fuzz/
