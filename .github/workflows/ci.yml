name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -d . && exit 1)
      - name: vet
        run: go vet ./...
      - name: lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.1
      - name: README examples are in sync
        run: go run github.com/campoy/embedmd@v1.0.0 -d README.md
      - name: run examples
        run: |
          go run ./examples/quickstart
          go run ./examples/scopes
      - name: test
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: benchmarks compile and run
        working-directory: benchmarks
        run: |
          go vet ./...
          go test -run '^$' -bench . -benchtime=50ms ./...
